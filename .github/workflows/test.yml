name: github actions 테스트

on:
	push:
		branches:
			- main

jobs:
	My_Deploy-job:
		runs-on: ubuntu-latest

		steps:
			- name: Hello World 찍기
			  run: echo "Hello World"

			- name: 여러 명령어 문장 작성
			  run: |
				  echo "Good"
				  echo "Morning"

			- name: Github Actions 자체에 저장된 변수 사용
			  run: |
				  echo $GITHUB_SHA
				  echo $GITHUB_REPOSITORY

			- name: GitHub Secrets 사용 예제
			  run: |
				  echo "${{ secrets.MY_NAME }}"
				  echo "${{ secrets.MY_HOBBY }}"